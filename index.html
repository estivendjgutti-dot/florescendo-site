<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Florescendo — Flores e Plantas</title>
<meta name="description" content="Protótipo de design: flores, plantas e presentes — Mercado das Flores, Vila Leopoldina, SP.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; -webkit-font-smoothing: antialiased; background:#FFF8F1; color:#171216; font-family:'Manrope',sans-serif; line-height:1.5; }
  a { color: #8B164C; text-decoration: none; }
  a:hover { color: #EC168F; }
  input, select, textarea, button { font-family: 'Manrope', sans-serif; }
  input::placeholder, textarea::placeholder { color: #8a7f84; }
  img, video { display:block; }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .hover-lift:hover { transform:translateY(-4px); box-shadow:0 10px 20px rgba(23,18,22,0.12); }
  .hover-card:hover { transform:translateY(-5px); box-shadow:0 14px 26px rgba(23,18,22,0.14); }
  .hover-scale:hover { transform:scale(1.03); }
  .hover-invert:hover { background:#171216; color:#FFF8F1 !important; }
  .hover-chip:hover { background:#EC168F !important; color:#fff !important; }
  .btn { cursor:pointer; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const WHATSAPP_NUMBER = '5511960341653';
function waLink(text){ return 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(text); }
function fmtBRL(cents){ return (cents/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

const CATEGORY_LABELS = { flores:'Flores', plantas:'Plantas', buques:'Buquês', arranjos:'Arranjos', presentes:'Presentes', vasos:'Vasos e complementos', eventos:'Decoração de eventos' };
const STOCK_META = {
  available: { label:'Disponível', bg:'#426B4A', fg:'#FFFFFF' },
  low: { label:'Últimas unidades', bg:'#8B164C', fg:'#FFFFFF' },
  onrequest: { label:'Sob consulta', bg:'#FBE7F0', fg:'#171216' },
  out: { label:'Esgotado', bg:'#F4EDE8', fg:'#171216' }
};
function stockForUnit2(code){ if (code==='low') return 'available'; if (code==='out') return 'onrequest'; return code; }
const PRODUCT_IMG_SRC = { 'orquidea-branca':'photos/orquidea.jpg', 'buque-rosas':'photos/buque.jpg', 'arranjo-tropical':'photos/evento.jpg', 'decoracao-evento':'photos/evento.jpg', 'cesta-presente':'photos/atendimento.jpg' };
const CAT_IMG_SRC = { plantas:'photos/orquidea.jpg', buques:'photos/buque.jpg', flores:'photos/buque.jpg', arranjos:'photos/evento.jpg', presentes:'photos/atendimento.jpg', vasos:'photos/loja.jpg', eventos:'photos/evento.jpg' };

const PRODUCTS = [
  { id:'buque-rosas', name:'Buquê de Rosas Vermelhas Clássico', category:'buques', occasion:'Romance, aniversário', priceCents:12990, stock:'available', variations:['12 rosas','24 rosas','36 rosas'], care:'Trocar a água a cada 2 dias e manter longe de luz direta.', deliveryInfo:'Preparo em até 4h; entrega no mesmo dia até 18h.', description:'Buquê clássico de rosas vermelhas, embalagem em papel kraft com laço.' },
  { id:'arranjo-tropical', name:'Arranjo Tropical Verde', category:'arranjos', occasion:'Decoração de ambientes', priceCents:18990, stock:'low', variations:['Vaso cerâmico','Vaso vidro'], care:'Manter em local com luz indireta; regar 2x por semana.', deliveryInfo:'Sob encomenda — preparo em até 24h.', description:'Composição de folhagens tropicais para ambientes internos.' },
  { id:'orquidea-branca', name:'Orquídea Phalaenopsis Branca', category:'plantas', occasion:'Presente, decoração', priceCents:14990, stock:'available', variations:['Vaso cerâmico branco','Vaso cerâmico rosa'], care:'Regar 1x por semana com água em temperatura ambiente.', deliveryInfo:'Entrega em até 24h.', description:'Orquídea branca elegante, ideal para presente ou para casa.' },
  { id:'kit-suculentas', name:'Kit Suculentas Mix (3 vasos)', category:'plantas', occasion:'Presente, escritório', priceCents:7990, stock:'available', variations:['Vasos brancos','Vasos terracota'], care:'Regar a cada 10–15 dias; luz indireta.', deliveryInfo:'Entrega em até 24h.', description:'Kit com 3 suculentas variadas em mini vasos.' },
  { id:'buque-girassois', name:'Buquê de Girassóis', category:'buques', occasion:'Alegria, aniversário', priceCents:9990, stock:'onrequest', variations:['Buquê simples','Buquê com folhagem'], care:'Trocar a água diariamente.', deliveryInfo:'Sob consulta de disponibilidade.', description:'Buquê alegre de girassóis, sob consulta conforme safra.' },
  { id:'cesta-presente', name:'Cesta de Café da Manhã com Flores', category:'presentes', occasion:'Aniversário, agradecimento', priceCents:21990, stock:'available', variations:['Cesta pequena','Cesta grande'], care:'Consumir itens perecíveis em até 2 dias.', deliveryInfo:'Agendar janela de entrega.', description:'Cesta com itens de café da manhã e flores — catálogo de exemplo.' },
  { id:'vaso-ceramico', name:'Vaso Cerâmico Artesanal', category:'vasos', occasion:'Complemento, decoração', priceCents:6990, stock:'available', variations:['Branco','Terracota','Rosa'], care:'Apenas o vaso — sem planta incluída.', deliveryInfo:'Entrega em até 24h.', description:'Vaso cerâmico artesanal, vendido separadamente.' },
  { id:'buque-rustico', name:'Buquê Rústico de Flores do Campo', category:'flores', occasion:'Presente, decoração', priceCents:8990, stock:'available', variations:['Tons rosa','Tons amarelo'], care:'Trocar a água a cada 2 dias.', deliveryInfo:'Entrega no mesmo dia até 18h.', description:'Buquê rústico com flores do campo em tons suaves.' },
  { id:'decoracao-evento', name:'Decoração Floral para Eventos', category:'eventos', occasion:'Casamento, festa, corporativo', priceCents:0, stock:'onrequest', variations:['Pacote essencial','Pacote completo'], care:'Projeto sob medida.', deliveryInfo:'Prazo definido junto ao orçamento.', description:'Projeto de decoração floral sob orçamento — use o formulário de orçamento.' },
  { id:'jiboia', name:'Jiboia (Pothos)', category:'plantas', occasion:'Presente, casa nova', priceCents:5990, stock:'out', variations:['Vaso pequeno','Vaso médio'], care:'Baixa manutenção; luz indireta.', deliveryInfo:'Indisponível — consulte alternativas no WhatsApp.', description:'Planta de baixa manutenção, ótima para presente de casa nova.' }
];

let state = {
  page: 'home',
  filterCategory: 'todos',
  filterAvailability: 'todos',
  filterPrice: 'todos',
  selectedProductId: null,
  selectedVariation: null,
  qty: 1,
  deliveryDate: '',
  deliveryWindow: 'manha',
  giftMessage: '',
  cart: [],
  cartOpen: false,
  addedToast: false,
  checkoutForm: { nome:'', telefone:'', endereco:'', mensagem:'' },
  checkoutPaymentDemo: 'idle',
  checkoutOrderNsu: null,
  lastOrder: null,
  quoteForm: { nome:'', whatsapp:'', email:'', tipo:'Casamento', data:'', local:'', faixa:'Até R$300', escala:'', referencias:'', mensagem:'' },
  quoteSubmitted: false,
  bannerDismissed: false
};

function setState(patch){ Object.assign(state, typeof patch === 'function' ? patch(state) : patch); render(); }

function navigate(page, opts){
  state.page = page; state.cartOpen = false;
  if (!opts || !opts.replace) {
    history.pushState({ page }, '', '#' + page);
  } else {
    history.replaceState({ page }, '', '#' + page);
  }
  render(); window.scrollTo(0,0);
}

window.addEventListener('popstate', (e) => {
  const page = (e.state && e.state.page) || (location.hash ? location.hash.slice(1) : 'home');
  state.page = page; state.cartOpen = false;
  render(); window.scrollTo(0,0);
});

function currentProductRaw(){ return PRODUCTS.find(p => p.id === state.selectedProductId); }

function cartItemsComputed(){
  return state.cart.map((entry, idx) => {
    const p = PRODUCTS.find(pp => pp.id === entry.productId) || {};
    const subtotal = (p.priceCents||0) * entry.qty;
    return { idx, name:p.name, variation:entry.variation, qty:entry.qty, imgSrc: PRODUCT_IMG_SRC[p.id] || '',
      deliveryLabel: (entry.deliveryDate || 'data a definir') + ' · ' + entry.deliveryWindow,
      subtotalLabel: fmtBRL(subtotal), subtotalCents: subtotal };
  });
}

function addToCart(){
  const p = currentProductRaw(); if (!p) return;
  const variation = state.selectedVariation || p.variations[0];
  const windowLabel = { manha:'Manhã', tarde:'Tarde', noite:'Noite' }[state.deliveryWindow] || 'Manhã';
  state.cart.push({ productId:p.id, variation, qty:state.qty, deliveryDate:state.deliveryDate, deliveryWindow:windowLabel, giftMessage:state.giftMessage });
  state.cartOpen = true; state.addedToast = true; render();
  setTimeout(() => { state.addedToast = false; render(); }, 2000);
}

function buildCardData(p){
  const meta = STOCK_META[p.stock];
  return { id:p.id, name:p.name, imgSrc: PRODUCT_IMG_SRC[p.id] || '', categoryLabel: CATEGORY_LABELS[p.category],
    priceLabel: p.priceCents > 0 ? fmtBRL(p.priceCents) : 'Sob orçamento', stockLabel: meta.label, stockBg: meta.bg, stockFg: meta.fg };
}

function productCardHTML(p){
  const c = buildCardData(p);
  return `<button class="hover-card btn" onclick="openProduct('${c.id}')" style="display:block;width:100%;text-align:left;background:#FFFFFF;border:1px solid #EADFD8;border-radius:16px;overflow:hidden;padding:0;transition:all .25s ease;">
    <div style="aspect-ratio:4/5;position:relative;overflow:hidden;background:#F4EDE8;">
      ${c.imgSrc ? `<img src="${c.imgSrc}" alt="${esc(c.name)}" style="width:100%;height:100%;object-fit:cover;">` : ''}
      <span style="position:absolute;top:10px;left:10px;background:#171216;color:#FFF8F1;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:10px;padding:3px 8px;">Exemplo</span>
    </div>
    <div style="padding:14px;">
      <div style="font-size:12px;color:#8B164C;font-weight:700;">${c.categoryLabel}</div>
      <div style="font-weight:700;font-size:15px;margin:4px 0 10px;line-height:1.3;">${esc(c.name)}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
        <span style="font-weight:800;font-size:15px;">${c.priceLabel}</span>
        <span style="background:${c.stockBg};color:${c.stockFg};border-radius:16px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap;">${c.stockLabel}</span>
      </div>
    </div>
  </button>`;
}

function openCategory(key){ state.filterCategory = key; state.filterAvailability='todos'; state.filterPrice='todos'; navigate('category'); }
function openProduct(id){ state.selectedProductId=id; state.selectedVariation=null; state.qty=1; state.deliveryDate=''; state.deliveryWindow='manha'; state.giftMessage=''; navigate('product'); }
function goBackCategory(){ const p = currentProductRaw(); state.filterCategory = p ? p.category : 'todos'; navigate('category'); }
function goCheckout(){ if (!state.checkoutOrderNsu) state.checkoutOrderNsu = 'FLR-' + Math.floor(1000+Math.random()*9000); navigate('checkout'); }
function toggleCart(){ state.cartOpen = !state.cartOpen; render(); }
function closeCart(){ state.cartOpen = false; render(); }
function incQty(){ state.qty++; render(); }
function decQty(){ state.qty = Math.max(1, state.qty-1); render(); }
function setVariation(v){ state.selectedVariation = v; render(); }
function cartInc(i){ state.cart[i].qty++; render(); }
function cartDec(i){ state.cart[i].qty = Math.max(1, state.cart[i].qty-1); render(); }
function cartRemove(i){ state.cart.splice(i,1); render(); }
function dismissBanner(){ state.bannerDismissed = true; render(); }

function payNow(){ state.checkoutPaymentDemo='pending'; render(); }
function setDemo(v){ state.checkoutPaymentDemo=v; render(); }
function retryPayment(){ state.checkoutPaymentDemo='idle'; render(); }
function confirmOrder(){
  const items = cartItemsComputed();
  const total = items.reduce((s,it)=>s+it.subtotalCents,0);
  state.lastOrder = { orderNumber: state.checkoutOrderNsu || ('FLR-'+Math.floor(1000+Math.random()*9000)), items, totalLabel: fmtBRL(total) };
  state.cart = []; state.checkoutPaymentDemo='idle'; state.checkoutOrderNsu=null;
  navigate('success');
}
function submitQuote(e){ e.preventDefault(); state.quoteSubmitted = true; render(); }
function resetQuote(){ state.quoteSubmitted=false; state.quoteForm={ nome:'', whatsapp:'', email:'', tipo:'Casamento', data:'', local:'', faixa:'Até R$300', escala:'', referencias:'', mensagem:'' }; render(); }
function setQuoteField(field, val){ state.quoteForm[field] = val; }
function setCheckoutField(field, val){ state.checkoutForm[field] = val; }

function header(){
  const cartCount = state.cart.reduce((s,c)=>s+c.qty,0);
  return `
  <header style="position:sticky;top:0;z-index:40;background:#FFF8F1;border-bottom:1px solid #EADFD8;padding:14px clamp(16px,4vw,48px);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;">
    <div style="display:flex;align-items:center;gap:12px;">
    ${state.page !== 'home' ? `<button class="btn" onclick="history.back()" aria-label="Voltar" style="display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;border:1.5px solid #EADFD8;background:#fff;font-size:16px;flex-shrink:0;">←</button>` : ''}
    <button class="btn" onclick="navigate('home')" style="display:flex;align-items:center;gap:10px;background:none;border:none;padding:0;">
      <svg width="38" height="38" viewBox="0 0 44 44" aria-hidden="true">
        <circle cx="31" cy="22" r="7" fill="#EC168F" opacity="0.9"></circle>
        <circle cx="24.8" cy="30.6" r="7" fill="#EC168F" opacity="0.9"></circle>
        <circle cx="14.7" cy="27.3" r="7" fill="#EC168F" opacity="0.9"></circle>
        <circle cx="14.7" cy="16.7" r="7" fill="#EC168F" opacity="0.9"></circle>
        <circle cx="24.8" cy="13.4" r="7" fill="#EC168F" opacity="0.9"></circle>
        <circle cx="22" cy="22" r="5.5" fill="#171216"></circle>
      </svg>
      <span style="display:flex;flex-direction:column;align-items:flex-start;line-height:1.1;">
        <span style="font-family:'Playfair Display',serif;font-weight:700;font-size:22px;">Florescendo</span>
        <span style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8B164C;font-weight:700;">Flores e Plantas</span>
      </span>
    </button>
    </div>
    <nav style="display:flex;gap:22px;flex-wrap:wrap;justify-content:center;">
      <button class="btn" onclick="openCategory('todos')" style="background:none;border:none;font-size:15px;font-weight:600;padding:4px 0;">Comprar</button>
      <button class="btn" onclick="navigate('quote')" style="background:none;border:none;font-size:15px;font-weight:600;padding:4px 0;">Orçamento</button>
      <button class="btn" onclick="navigate('stores')" style="background:none;border:none;font-size:15px;font-weight:600;padding:4px 0;">Lojas</button>
      <button class="btn" onclick="navigate('about')" style="background:none;border:none;font-size:15px;font-weight:600;padding:4px 0;">Sobre</button>
    </nav>
    <div style="display:flex;align-items:center;gap:12px;">
      <a href="https://www.instagram.com/florescendo.floreseplantas/" target="_blank" aria-label="Instagram da Florescendo" style="display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;border:1.5px solid #171216;color:#171216;font-size:16px;">📷</a>
      <a href="${waLink('Olá! Vim pelo site da Florescendo e gostaria de saber mais.')}" target="_blank" style="display:flex;align-items:center;gap:8px;background:#426B4A;color:#fff;border-radius:24px;padding:10px 18px;font-weight:700;font-size:14px;">
        <span style="width:16px;height:14px;background:#fff;border-radius:8px 8px 8px 2px;display:inline-block;"></span>WhatsApp
      </a>
      <button class="btn" onclick="toggleCart()" style="position:relative;background:#171216;color:#FFF8F1;border:none;border-radius:50%;width:44px;height:44px;font-size:18px;">🛒
        ${cartCount>0 ? `<span style="position:absolute;top:-6px;right:-6px;background:#EC168F;color:#171216;font-weight:800;font-size:11px;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;border:2px solid #FFF8F1;">${cartCount}</span>` : ''}
      </button>
    </div>
  </header>`;
}

function banner(){
  if (state.bannerDismissed) return '';
  return `<div style="background:#171216;color:#FFF8F1;padding:10px 20px;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;text-align:center;font-size:13px;">
    <span>🌿 Protótipo de design — catálogo, preços e endereços de exemplo até validação com a operação.</span>
    <button class="btn" onclick="dismissBanner()" style="background:none;border:1px solid #FFF8F1;color:#FFF8F1;border-radius:20px;padding:2px 12px;font-size:12px;">Entendi</button>
  </div>`;
}

function homePage(){
  const intentChips = [
    { label:'Presentear', cat:'presentes' }, { label:'Decorar', cat:'arranjos' }, { label:'Cuidar', cat:'plantas' }
  ];
  const spotlight = buildCardData(PRODUCTS.find(p=>p.id==='orquidea-branca'));
  const featuredIds = ['buque-rosas','orquidea-branca','arranjo-tropical','buque-rustico','cesta-presente','kit-suculentas'];
  const featured = PRODUCTS.filter(p=>featuredIds.includes(p.id));
  return `
  <section style="position:relative;min-height:clamp(480px,72vh,640px);display:flex;align-items:center;overflow:hidden;">
    <div style="position:absolute;inset:0;overflow:hidden;">
      <video autoplay muted loop playsinline poster="photos/hero-bg.jpg" style="width:100%;height:100%;object-fit:cover;">
        <source src="photos/hero-bg.mp4" type="video/mp4">
      </video>
    </div>
    <div style="position:absolute;inset:0;background:linear-gradient(100deg, rgba(255,248,241,0.95) 0%, rgba(255,248,241,0.75) 38%, rgba(255,248,241,0.15) 68%, rgba(255,248,241,0) 85%);pointer-events:none;"></div>
    <span style="position:absolute;bottom:20px;right:20px;background:#EC168F;color:#171216;font-weight:800;font-size:12px;border-radius:20px;padding:6px 14px;z-index:1;">Direto da nossa loja</span>
    <div style="position:relative;z-index:1;max-width:1280px;margin:0 auto;width:100%;padding:0 clamp(16px,4vw,48px);">
      <div style="max-width:520px;animation:fadeInUp .7s ease both;">
        <span style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#8B164C;font-weight:700;">Florescendo · Mercado das Flores, Vila Leopoldina</span>
        <h1 style="font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(34px,5vw,56px);margin:14px 0 16px;line-height:1.05;">Flores e plantas com quem entende de cuidado</h1>
        <p style="font-size:17px;color:#3d3438;max-width:460px;margin:0 0 24px;">Curadoria de buquês, plantas, arranjos e presentes — com disponibilidade real e atendimento próximo, do catálogo até a entrega.</p>
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px;">
          <button class="hover-scale btn" onclick="openCategory('todos')" style="background:#8B164C;color:#fff;border:none;border-radius:10px;padding:14px 26px;font-weight:700;font-size:15px;transition:transform .2s ease;">Comprar agora</button>
          <a class="hover-invert" href="${waLink('Olá! Vim pelo site da Florescendo e gostaria de saber mais.')}" target="_blank" style="background:transparent;border:1.5px solid #171216;border-radius:10px;padding:14px 26px;font-weight:700;font-size:15px;color:#171216;transition:all .2s ease;">Falar no WhatsApp</a>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          ${intentChips.map(c=>`<button class="hover-chip btn" onclick="openCategory('${c.cat}')" style="background:#FBE7F0;border:none;border-radius:20px;padding:8px 16px;font-size:13px;font-weight:600;transition:all .2s ease;">${c.label}</button>`).join('')}
          <button class="hover-chip btn" onclick="navigate('stores')" style="background:#FBE7F0;border:none;border-radius:20px;padding:8px 16px;font-size:13px;font-weight:600;">Encontrar uma loja</button>
          <button class="hover-chip btn" onclick="navigate('quote')" style="background:#FBE7F0;border:none;border-radius:20px;padding:8px 16px;font-size:13px;font-weight:600;">Pedir orçamento</button>
        </div>
      </div>
    </div>
  </section>

  <section style="background:#EC168F;padding:clamp(22px,4vw,34px) clamp(16px,4vw,48px);">
    <p style="max-width:1280px;margin:0 auto;font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(20px,2.6vw,30px);text-align:center;line-height:1.3;">Cuidado de quem entende de cada folha, pétala e entrega.</p>
  </section>

  <section style="max-width:1280px;margin:0 auto;padding:clamp(28px,5vw,48px) clamp(16px,4vw,48px) 0;">
    <div style="background:#171216;border-radius:20px;padding:clamp(20px,4vw,32px);display:flex;gap:32px;flex-wrap:wrap;align-items:center;color:#FFF8F1;">
      <div style="flex:1 1 280px;min-width:240px;">
        <div style="aspect-ratio:4/5;border-radius:16px;overflow:hidden;position:relative;">
          <img src="${spotlight.imgSrc}" alt="${esc(spotlight.name)}" style="width:100%;height:100%;object-fit:cover;">
          <span style="position:absolute;top:10px;left:10px;background:#171216;color:#FFF8F1;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:12px;padding:4px 10px;">Exemplo</span>
        </div>
      </div>
      <div style="flex:1 1 280px;min-width:240px;">
        <span style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#EC168F;font-weight:700;">Produto em destaque</span>
        <h2 style="font-family:'Playfair Display',serif;font-size:clamp(22px,2.8vw,30px);font-weight:600;margin:10px 0;">${spotlight.name}</h2>
        <p style="font-size:15px;color:#d8cdd2;margin:0 0 18px;">${spotlight.categoryLabel} · ${spotlight.priceLabel}</p>
        <button class="btn" onclick="openProduct('${spotlight.id}')" style="background:#FFF8F1;color:#171216;border:none;border-radius:10px;padding:12px 24px;font-weight:700;font-size:14px;">Ver produto</button>
      </div>
    </div>
  </section>

  <section style="max-width:1280px;margin:0 auto;padding:0 clamp(16px,4vw,48px) 40px;">

function categoryPage(){
  let filtered = PRODUCTS;
  if (state.filterCategory !== 'todos') filtered = filtered.filter(p=>p.category===state.filterCategory);
  if (state.filterAvailability !== 'todos') filtered = filtered.filter(p=>p.stock===state.filterAvailability);
  if (state.filterPrice === 'lt100') filtered = filtered.filter(p=>p.priceCents>0 && p.priceCents<10000);
  if (state.filterPrice === 'mid') filtered = filtered.filter(p=>p.priceCents>=10000 && p.priceCents<=20000);
  if (state.filterPrice === 'gt200') filtered = filtered.filter(p=>p.priceCents>20000);

  const catChips = [{key:'todos',label:'Todos'}, ...Object.keys(CATEGORY_LABELS).map(k=>({key:k,label:CATEGORY_LABELS[k]}))];
  const availChips = [{key:'todos',label:'Disponibilidade: todos'},{key:'available',label:'Disponível'},{key:'onrequest',label:'Sob consulta'}];
  const priceChips = [{key:'todos',label:'Preço: todos'},{key:'lt100',label:'Até R$100'},{key:'mid',label:'R$100–200'},{key:'gt200',label:'Acima de R$200'}];

  function chip(c, current, setter, outline){
    const active = current === c.key;
    return `<button class="btn" onclick="${setter}('${c.key}')" style="background:${active ? (outline?'#171216':'#8B164C') : '#FFFFFF'};color:${active?'#FFFFFF':'#171216'};border:${outline?'1px solid #EADFD8':'none'};border-radius:20px;padding:${outline?'6px 14px':'8px 16px'};font-size:${outline?'12px':'13px'};font-weight:700;">${c.label}</button>`;
  }

  return `
  <section style="max-width:1280px;margin:0 auto;padding:clamp(20px,4vw,40px) clamp(16px,4vw,48px) 60px;">
    <div style="font-size:13px;color:#8a7f84;margin-bottom:10px;"><button class="btn" onclick="navigate('home')" style="background:none;border:none;color:#8a7f84;padding:0;font-size:13px;">Início</button> / Comprar</div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;">${catChips.map(c=>chip(c,state.filterCategory,'setFilterCategory')).join('')}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;">${availChips.map(c=>chip(c,state.filterAvailability,'setFilterAvailability',true)).join('')}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px;">${priceChips.map(c=>chip(c,state.filterPrice,'setFilterPrice',true)).join('')}</div>
    ${filtered.length===0 ? `<div style="background:#fff;border:1px dashed #EADFD8;border-radius:16px;padding:32px;text-align:center;color:#8a7f84;">Nenhum produto encontrado com esses filtros (catálogo de exemplo). <a href="${waLink('Olá! Vim pelo site da Florescendo e gostaria de saber mais.')}" target="_blank">Fale no WhatsApp</a> para consultar disponibilidade.</div>` : ''}
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px;">
      ${filtered.map(productCardHTML).join('')}
    </div>
  </section>`;
}

      ${footer()}
      ${cartDrawer()}
      <a href="${waFloat}" target="_blank" style="position:fixed;bottom:22px;right:22px;z-index:45;display:flex;align-items:center;gap:8px;background:#426B4A;color:#fff;border-radius:30px;padding:14px 20px;font-weight:700;font-size:14px;box-shadow:0 8px 20px rgba(23,18,22,0.2);">
        <span style="width:18px;height:15px;background:#fff;border-radius:9px 9px 9px 2px;display:inline-block;"></span>Falar no WhatsApp
      </a>
      <div style="position:fixed;bottom:${state.addedToast?'24px':'-80px'};left:50%;transform:translateX(-50%);background:#171216;color:#FFF8F1;padding:12px 22px;border-radius:30px;font-weight:700;font-size:14px;transition:bottom .3s ease;z-index:60;">Adicionado ao carrinho 🌿</div>
    </div>`;
}

history.replaceState({ page: state.page }, '', '#' + state.page);
render();
</script>
</body>
</html>
